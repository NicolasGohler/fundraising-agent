name: Weekly Fundraising Agent
on:
  schedule:
    - cron: '0 9 * * 1' # Every Monday at 9 AM UTC
  workflow_dispatch: # Allow manual trigger

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg
          
      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps chromium
          
      - name: Run fundraising agent
        env:
          APOLLO_API_KEY: ${{ secrets.APOLLO_API_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ secrets.SLACK_CHANNEL }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          CRYPTORANK_COOKIES: ${{ secrets.CRYPTORANK_COOKIES }}
          LINAUTO_API_KEY: ${{ secrets.LINAUTO_API_KEY }}
        run: python fundraising.py
        
      - name: Upload results as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: funding-data-${{ github.run_number }}
          path: |
            Fundraises - *
          retention-days: 30
          
      # Note: Slack upload is handled by the Python script itself (send_to_slack function)
      # No need to upload here to avoid duplicates
